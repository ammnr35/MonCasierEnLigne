function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB indisponible'));return;}const req=indexedDB.open('EtudesWorkspaceDB',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('app'))d.createObjectStore('app');if(!d.objectStoreNames.contains('attachments'))d.createObjectStore('attachments',{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function idbStore(store,mode,fn){return new Promise((resolve,reject)=>{if(!db){reject(new Error('Base locale indisponible'));return;}const tx=db.transaction(store,mode);const req=fn(tx.objectStore(store));if(req){req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);}else{tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);}})}

function renderDeckDetail(deck){return `<div class="practice-top"><button class="btn-quiet" data-action="back-decks">${icon('back',15)} Tous les paquets</button><div class="muted tiny">${(deck.cards||[]).length} cartes</div></div><div class="glass panel"><div class="section-head"><div><h2>${esc(deck.title)}</h2><div class="section-sub">${esc(deck.description||'Entraîne-toi pour retenir les notions essentielles.')}</div></div><button class="btn" data-action="practice-deck" data-id="${deck.id}" ${!(deck.cards||[]).length?'disabled':''}>${icon('spark',15)} Réviser</button></div><div class="separator"></div><div class="section-head"><div><h2>Les cartes</h2><div class="section-sub">Question au recto, réponse au verso.</div></div><button class="btn-secondary" data-action="new-card" data-id="${deck.id}">${icon('plus',14)} Ajouter une carte</button></div>${(deck.cards||[]).length?`<div class="event-list">${deck.cards.map((c,i)=>`<div class="event-row"><div class="event-date"><div class="day">${String(i+1).padStart(2,'0')}</div><div class="month">CARTE</div></div><div class="event-info"><div class="event-name">${esc(c.front)}</div><div class="event-meta">${esc(c.back)}</div></div><button class="mini-action" title="Modifier" data-action="edit-card" data-id="${c.id}" data-deck="${deck.id}">${icon('edit',14)}</button><button class="mini-action" title="Supprimer" data-action="delete-card" data-id="${c.id}" data-deck="${deck.id}">${icon('trash',14)}</button></div>`).join('')}</div>`:empty('layers','Aucune carte pour le moment','Ajoute la première question et sa réponse.','Ajouter une carte','new-card')}</div>`;}
function renderPractice(){const deck=state.decks.find(d=>d.id===practice.deckId);if(!deck){practice=null;return renderRevision();}const cards=practice.cards;const current=cards[practice.index];if(!current)return `<div class="glass panel">${empty('check','Session terminée !',`Tu as révisé ${practice.known} carte(s) sur ${cards.length}.`,'Retour au paquet','finish-practice')}</div>`;return `<div class="practice-wrap"><div class="practice-top"><button class="btn-quiet" data-action="stop-practice">${icon('back',15)} Quitter la session</button><span class="muted tiny">${practice.index+1} / ${cards.length}</span></div><div class="practice-progress"><span style="width:${((practice.index)/cards.length)*100}%"></span></div><div class="glass flashcard" data-action="flip-card" role="button" tabindex="0"><div class="card-kicker">${practice.revealed?'Réponse':'Question'}</div><div class="flashcard-text">${esc(practice.revealed?current.back:current.front)}</div><div class="flip-hint">${practice.revealed?'Choisis comment tu t’en es sorti.':'Appuie sur la carte pour afficher la réponse'}</div></div>${practice.revealed?`<div class="practice-actions"><button class="btn-secondary" data-action="practice-rate" data-known="0">${icon('refresh',15)} À revoir</button><button class="btn" data-action="practice-rate" data-known="1">${icon('check',15)} Je connais</button></div>`:`<div class="practice-actions"><button class="btn" data-action="flip-card">Afficher la réponse ${icon('chevron',15)}</button></div>`}<div class="muted tiny" style="text-align:center;margin-top:16px">${practice.known} carte(s) maîtrisée(s) pendant cette session</div></div>`;}
function formatRelative(ts){if(!ts)return 'à l’instant';const days=Math.floor((Date.now()-ts)/86400000);if(days<=0)return 'aujourd’hui';if(days===1)return 'hier';return `il y a ${days} jours`;}
function renderSettings(){const swatches=['#7668e8','#2688e8','#159f91','#e19a3d','#e46b82','#9a66c8','#343640'];return `<div class="settings-layout"><div class="settings-stack"><div class="glass panel"><div class="section-head"><div><h2>Apparence</h2><div class="section-sub">Choisis une ambiance qui te ressemble.</div></div><span class="stat-icon">${icon('spark',18)}</span></div><div class="setting-row"><div><div class="setting-name">Couleur d’accent</div><div class="setting-help">Utilisée pour les boutons, icônes et éléments actifs.</div></div><div class="swatches">${swatches.map(c=>`<button class="swatch ${state.settings.accent===c?'active':''}" style="background:${c}" aria-label="Couleur ${c}" data-action="set-accent" data-color="${c}"></button>`).join('')}<label class="swatch" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);display:grid;place-items:center;cursor:pointer" title="Choisir une couleur"><input type="color" class="color-input" id="customAccent" value="${esc(state.settings.accent)}" aria-label="Couleur personnalisée"></label></div></div><div class="setting-row"><div><div class="setting-name">Apparence générale</div><div class="setting-help">L’affichage peut suivre ton système.</div></div><div class="appearance-options">${[['light','Clair'],['dark','Sombre'],['system','Auto']].map(([v,l])=>`<button class="${state.settings.appearance===v?'active':''}" data-action="set-appearance" data-mode="${v}">${l}</button>`).join('')}</div></div></div><div class="glass panel"><div class="section-head"><div><h2>Types d’événements</h2><div class="section-sub">Crée tes propres classes : devoir, oral, contrôle, projet…</div></div><button class="btn-secondary" data-action="new-category">${icon('plus',14)} Ajouter</button></div><div class="category-settings">${state.categories.map(c=>`<div class="category-setting-row"><span class="category-swatch" style="background:${c.color}"></span><span>${esc(c.name)}</span><small>${state.events.filter(e=>e.categoryId===c.id).length} événement(s)</small><button class="mini-action" title="Modifier" data-action="edit-category" data-id="${c.id}">${icon('edit',13)}</button><button class="mini-action" title="Supprimer" data-action="delete-category" data-id="${c.id}">${icon('trash',13)}</button></div>`).join('')||'<div class="muted tiny">Aucune catégorie. Ajoute-en une pour personnaliser ton agenda.</div>'}</div></div></div><div class="settings-stack"><div class="glass panel"><div class="section-head"><div><h2>Données et sauvegarde</h2><div class="section-sub">Tu gardes la main sur tes contenus.</div></div><span class="stat-icon">${icon('database',18)}</span></div><button class="settings-action" data-action="export-data">${icon('download',19)}<span class="sa-text"><strong>Exporter toutes mes données</strong><small>Télécharge une sauvegarde JSON incluant événements, synthèses, flashcards et fichiers joints.</small></span>${icon('chevron',15)}</button><button class="settings-action" data-action="import-data">${icon('upload',19)}<span class="sa-text"><strong>Importer une sauvegarde</strong><small>Restaure une sauvegarde depuis un fichier JSON.</small></span>${icon('chevron',15)}</button><input id="importInput" class="hidden" type="file" accept=".json,application/json"><div class="separator"></div><div style="font-size:10px;line-height:1.6;color:var(--muted)">${dbReady?'✓ Sauvegarde automatique locale active via IndexedDB.':'Sauvegarde locale du navigateur active.'} Les fichiers et données ne sont pas synchronisés automatiquement entre appareils. Utilise l’export/import pour les transférer.</div></div><div class="glass panel"><div class="section-head"><div><h2>À propos de ton espace</h2><div class="section-sub">Un outil personnel pour mieux t’organiser.</div></div><span class="stat-icon">${icon('bookOpen',18)}</span></div><div class="setting-row"><div><div class="setting-name">Version</div><div class="setting-help">Première version — les nouveautés pourront être ajoutées facilement.</div></div><span class="pill">v1.0</span></div><div class="setting-row"><div><div class="setting-name">Stockage</div><div class="setting-help">Les pièces jointes occupent de l’espace dans le stockage de ton navigateur.</div></div><span class="pill">Local</span></div><button class="settings-action" data-action="clear-data">${icon('trash',19)}<span class="sa-text"><strong class="danger-text">Réinitialiser l’espace</strong><small>Efface les données enregistrées dans ce navigateur. Exporte une copie avant cette action.</small></span>${icon('chevron',15)}</button></div></div></div>`;}
function modalShell(title,sub,body,opts={}){const root=$('#modalRoot');root.innerHTML=`<div class="modal ${opts.wide?'wide':''}"><div class="modal-head"><div><h2 class="modal-title">${title}</h2>${sub?`<div class="modal-sub">${sub}</div>`:''}</div><button class="modal-close" data-action="close-modal" aria-label="Fermer">${icon('x',17)}</button></div>${body}</div>`;root.classList.add('open');const first=$('input:not([type=hidden]),textarea,select,button',root);if(first)setTimeout(()=>{try{first.focus({preventScroll:true})}catch{}},40);}
function closeModal(){$('#modalRoot').classList.remove('open');$('#modalRoot').innerHTML='';}
function modalActions(cancel='Annuler',submit='Enregistrer'){return `<div class="modal-actions"><button class="btn-quiet" type="button" data-action="close-modal">${cancel}</button><button class="btn" type="submit">${submit}</button></div>`;}
function openEventModal(id=null,date=null){const e=id?state.events.find(e=>e.id===id):null;const cats=state.categories.map(c=>`<option value="${c.id}" ${(e?e.categoryId===c.id:state.categories[0]?.id===c.id)?'selected':''}>${esc(c.name)}</option>`).join('');modalShell(e?'Modifier l’événement':'Nouvel événement', 'Devoir, évaluation, révision ou autre moment important.',`<form data-form="event"><input type="hidden" name="id" value="${e?.id||''}"><div class="form-grid"><div class="field full"><label for="evTitle">Nom de l’événement *</label><input id="evTitle" name="title" required maxlength="120" placeholder="Ex. Contrôle de droit" value="${esc(e?.title||'')}"></div><div class="field"><label for="evType">Type</label><select id="evType" name="categoryId">${cats}</select></div><div class="field"><label for="evDate">Date *</label><input id="evDate" name="date" type="date" required value="${e?.date||date||agendaDate||isoToday()}"></div><div class="field"><label for="evTime">Heure (facultatif)</label><input id="evTime" name="time" type="time" value="${e?.time||''}"></div><div class="field"><label for="evLocation">Lieu (facultatif)</label><input id="evLocation" name="location" maxlength="100" placeholder="Ex. Salle B12" value="${esc(e?.location||'')}"></div><div class="field full"><label for="evDesc">Notes (facultatif)</label><textarea id="evDesc" name="description" placeholder="Chapitres à apprendre, consignes…">${esc(e?.description||'')}</textarea></div><div class="field full"><label class="event-check"><input type="checkbox" name="done" ${e?.done?'checked':''}> Marquer comme terminé</label></div></div>${modalActions('Annuler',e?'Enregistrer':'Ajouter à l’agenda')}${e?`<div style="text-align:left;margin-top:5px"><button class="btn-quiet danger-text" type="button" data-action="delete-event" data-id="${e.id}">${icon('trash',14)} Supprimer cet événement</button></div>`:''}</form>`);}
function openFolderModal(){modalShell('Nouveau dossier','Crée un dossier ou un sous-dossier dans l’emplacement actuel.',`<form data-form="folder"><div class="field"><label for="folderName">Nom du dossier *</label><input id="folderName" name="name" required maxlength="100" placeholder="Ex. Management, Chapitre 2…"></div><div class="field" style="margin-top:14px"><label for="folderParent">Emplacement</label><select id="folderParent" name="parentId"><option value="">Racine — Mes documents</option>${state.nodes.filter(n=>n.type==='folder').map(n=>`<option value="${n.id}" ${n.id===folderId?'selected':''}>${esc(pathNodes(n.id).map(x=>x.name).join(' / '))}</option>`).join('')}</select></div>${modalActions('Annuler','Créer le dossier')}</form>`);}
function openSummaryModal(id=null){const s=id?state.summaries.find(s=>s.id===id):null;summaryEditingId=id;modalShell(s?'Modifier la synthèse':'Importer une synthèse','Associe chaque document à une matière et à un chapitre.',`<form data-form="summary"><input type="hidden" name="id" value="${s?.id||''}"><div class="form-grid"><div class="field full"><label for="sumTitle">Nom de la synthèse *</label><input id="sumTitle" name="title" required maxlength="150" placeholder="Ex. L’exécution du contrat" value="${esc(s?.title||'')}"></div><div class="field"><label for="sumSubject">Matière</label><input id="sumSubject" name="subject" maxlength="80" placeholder="Ex. Droit" value="${esc(s?.subject||'')}"></div><div class="field"><label for="sumChapter">Chapitre associé</label><input id="sumChapter" name="chapter" maxlength="120" placeholder="Ex. Chapitre 2" value="${esc(s?.chapter||'')}"></div><div class="field full"><label for="sumTags">Mots-clés (facultatif)</label><input id="sumTags" name="tags" placeholder="contrat, obligations…" value="${esc(s?.tags||'')}"></div><div class="field full"><label for="sumFile">Importer une synthèse existante</label><input id="sumFile" name="summaryFile" type="file" accept=".pdf,.doc,.docx,.odt,.txt,.rtf,.md,.jpg,.jpeg,.png" ${s?.attachment?'':'required'}><div class="field-help">${s?.attachment?`Fichier actuel : ${esc(s.attachment.name)}. Choisis un autre fichier pour le remplacer.`:'PDF, Word, texte ou image. Le fichier sera conservé dans la sauvegarde exportée.'}</div></div><div class="field full"><label for="sumContent">Notes complémentaires (facultatif)</label><textarea class="large" id="sumContent" name="content" placeholder="Quelques repères ou rappels…">${esc(s?.content||'')}</textarea></div></div>${modalActions('Annuler',s?'Enregistrer les changements':'Importer la synthèse')}${s?`<div style="margin-top:4px"><button type="button" class="btn-quiet danger-text" data-action="delete-summary" data-id="${s.id}">${icon('trash',14)} Supprimer cette synthèse</button></div>`:''}</form>`,{wide:true});}
function openDeckModal(){modalShell('Nouveau paquet de flashcards','Un paquet par matière, chapitre ou thème.',`<form data-form="deck"><div class="field"><label for="deckTitle">Nom du paquet *</label><input id="deckTitle" name="title" required maxlength="100" placeholder="Ex. Définitions du droit"></div><div class="field" style="margin-top:14px"><label for="deckDescription">Description (facultatif)</label><textarea id="deckDescription" name="description" placeholder="Les notions à retenir…"></textarea></div>${modalActions('Annuler','Créer le paquet')}</form>`);}
function openCardModal(deckId,cardId=null){const deck=state.decks.find(d=>d.id===deckId);if(!deck)return;const card=cardId?(deck.cards||[]).find(c=>c.id===cardId):null;modalShell(card?'Modifier la carte':'Ajouter des flashcards','Écris une question au recto et une réponse courte au verso.',`<form data-form="card"><input type="hidden" name="deckId" value="${deckId}"><input type="hidden" name="id" value="${card?.id||''}"><div class="field"><label for="cardFront">Recto — question *</label><textarea id="cardFront" name="front" required placeholder="Ex. Qu’est-ce qu’un contrat ?">${esc(card?.front||'')}</textarea></div><div class="field" style="margin-top:14px"><label for="cardBack">Verso — réponse *</label><textarea id="cardBack" name="back" required placeholder="Ex. Un accord de volontés destiné à créer…">${esc(card?.back||'')}</textarea></div>${modalActions('Annuler',card?'Enregistrer':'Ajouter la carte')}</form>`);}
function openCategoryModal(id=null){const cat=id?state.categories.find(c=>c.id===id):null;modalShell(cat?'Modifier le type':'Nouveau type d’événement','Choisis un nom et une couleur pour repérer facilement tes événements.',`<form data-form="category"><input type="hidden" name="id" value="${cat?.id||''}"><div class="form-grid"><div class="field full"><label for="catName">Nom *</label><input id="catName" name="name" required maxlength="40" placeholder="Ex. Oral, Projet, Bac blanc…" value="${esc(cat?.name||'')}"></div><div class="field full"><label for="catColor">Couleur</label><input id="catColor" name="color" type="color" value="${cat?.color||state.settings.accent}"></div></div>${modalActions('Annuler','Enregistrer le type')}</form>`);}
function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;$('#toastWrap').append(el);setTimeout(()=>el.remove(),3200);}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function bytesToBase64(buffer){const bytes=new Uint8Array(buffer);let bin='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode(...bytes.subarray(i,Math.min(i+chunk,bytes.length)));return btoa(bin);}
function base64ToBlob(data,mime){const bin=atob(data),len=bin.length,bytes=new Uint8Array(len);for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type:mime||'application/octet-stream'});}
async function exportData(){try{await saveChain;const attachments=[];for(const n of state.nodes.filter(n=>n.type==='file')){const a=await getAttachment(n.id);if(a&&a.blob){attachments.push({id:n.id,name:a.name||n.name,mime:a.mime||a.blob.type||'application/octet-stream',data:bytesToBase64(await a.blob.arrayBuffer())});}}const bundle={format:'etudes-workspace-backup',version:1,exportedAt:new Date().toISOString(),state,attachments};downloadBlob(new Blob([JSON.stringify(bundle)],{type:'application/json;charset=utf-8'}),`sauvegarde-etudes-${isoToday()}.json`);toast(`Sauvegarde exportée (${attachments.length} fichier(s) joint(s)).`);}catch(e){console.error(e);toast('Impossible de créer la sauvegarde complète.');}}
async function importDataFile(file){try{const bundle=JSON.parse(await file.text());if(!bundle||bundle.format!=='etudes-workspace-backup'||!bundle.state)throw new Error('Fichier de sauvegarde non reconnu');if(!confirm('Importer cette sauvegarde va remplacer les données actuelles de cet espace. As-tu une copie de sécurité ?'))return;const incoming={...freshState(),...bundle.state,settings:{...freshState().settings,...(bundle.state.settings||{})}};if(dbReady&&db){await idbStore('attachments','readwrite',s=>s.clear());for(const a of (bundle.attachments||[])){await idbStore('attachments','readwrite',s=>s.put({id:a.id,name:a.name,mime:a.mime,blob:base64ToBlob(a.data,a.mime),updatedAt:Date.now()}));}}else{fallbackBlobs={};for(const a of (bundle.attachments||[]))fallbackBlobs[a.id]={blob:base64ToBlob(a.data,a.mime),name:a.name,mime:a.mime};}state=incoming;folderId=null;selectedDeck=null;practice=null;await saveState();applySettings();render();toast('Sauvegarde importée avec succès.');}catch(e){console.error(e);toast('Ce fichier ne semble pas être une sauvegarde valide.');}}
async function uploadFiles(files){let count=0;for(const file of files){const id=uid();const node={id,name:file.name,type:'file',parentId:folderId,size:file.size,mime:file.type||'application/octet-stream',createdAt:Date.now()};state.nodes.push(node);try{await putAttachment(id,file);count++;}catch(e){state.nodes=state.nodes.filter(n=>n.id!==id);toast(`Impossible d’importer ${file.name}. L’espace de stockage est peut-être plein.`);}}await saveState();render();if(count)toast(`${count} fichier(s) ajouté(s).`);}
async function downloadFile(id){const n=state.nodes.find(n=>n.id===id);if(!n)return;const a=await getAttachment(id);if(!a||!a.blob){toast('Fichier indisponible : importe peut-être une sauvegarde complète.');return;}downloadBlob(a.blob,n.name);}
function deleteNode(id){const n=state.nodes.find(n=>n.id===id);if(!n)return;if(!confirm(`Supprimer ${n.type==='folder'?'ce dossier et son contenu':'ce fichier'} ?`))return;const ids=n.type==='folder'?allDescendantIds(id):[id];for(const itemId of ids){const item=state.nodes.find(x=>x.id===itemId);if(item?.type==='file')deleteAttachment(itemId).catch(console.error);}state.nodes=state.nodes.filter(n=>!ids.includes(n.id));if(ids.includes(folderId))folderId=n.parentId||null;saveState();render();toast('Élément supprimé.');}
function renameNode(id){const n=state.nodes.find(n=>n.id===id);if(!n)return;modalShell('Renommer',`Donne un nouveau nom à ${n.type==='folder'?'ce dossier':'ce fichier'}.`,`<form data-form="rename-node"><input type="hidden" name="id" value="${id}"><div class="field"><label for="nodeName">Nouveau nom *</label><input id="nodeName" name="name" required maxlength="180" value="${esc(n.name)}"></div>${modalActions('Annuler','Renommer')}</form>`);}
function deleteEvent(id){if(!confirm('Supprimer cet événement ?'))return;state.events=state.events.filter(e=>e.id!==id);closeModal();saveState();render();toast('Événement supprimé.');}
function deleteSummary(id){const s=state.summaries.find(s=>s.id===id);if(!s)return;if(!confirm(`Supprimer la synthèse « ${s.title} » ?`))return;state.summaries=state.summaries.filter(s=>s.id!==id);closeModal();summaryEditingId=null;saveState();render();toast('Synthèse supprimée.');}
function deleteCategory(id){const c=state.categories.find(c=>c.id===id);if(!c)return;if(state.events.some(e=>e.categoryId===id)){toast('Cette catégorie est utilisée par des événements. Modifie-les ou supprime-les avant.');return;}if(!confirm(`Supprimer le type « ${c.name} » ?`))return;state.categories=state.categories.filter(x=>x.id!==id);saveState();render();toast('Type supprimé.');}
function deleteCard(deckId,cardId){const d=state.decks.find(d=>d.id===deckId);if(!d)return;if(!confirm('Supprimer cette flashcard ?'))return;d.cards=(d.cards||[]).filter(c=>c.id!==cardId);d.known=Math.min(d.known||0,d.cards.length);saveState();render();toast('Carte supprimée.');}
function startPractice(id){const d=state.decks.find(d=>d.id===id);if(!d||!d.cards?.length){toast('Ajoute au moins une carte avant de commencer.');return;}practice={deckId:id,cards:[...d.cards].sort(()=>Math.random()-.5),index:0,revealed:false,known:0};render();}
function rateCard(known){if(!practice)return;const deck=state.decks.find(d=>d.id===practice.deckId);if(known){practice.known++;if(deck){deck.known=Math.min((deck.known||0)+1,(deck.cards||[]).length);saveState();}}practice.index++;practice.revealed=false;render();}
function dataUrlToBlob(dataUrl){const parts=dataUrl.split(',');const mime=(parts[0].match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const raw=atob(parts[1]||'');const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:mime});}
function viewSummary(id){const sm=state.summaries.find(x=>x.id===id);if(!sm)return;const a=sm.attachment;let body='';if(a?.data){const type=(a.type||'').toLowerCase(),name=(a.name||'').toLowerCase();if(type==='application/pdf'||name.endsWith('.pdf'))body=`<iframe class="summary-viewer" title="${esc(sm.title)}" src="${a.data}"></iframe>`;else if(type.startsWith('image/'))body=`<div class="summary-viewer" style="overflow:auto;display:grid;place-items:center;padding:10px"><img src="${a.data}" alt="${esc(sm.title)}"></div>`;else if(type.startsWith('text/')||/\.(txt|md|csv|rtf)$/.test(name)){try{body=`<div class="summary-viewer summary-viewer-text">${esc(decodeURIComponent(escape(atob(a.data.split(',')[1]||''))))}</div>`}catch(e){body=`<p>Ce format ne peut pas être prévisualisé ici.</p>`}}else body=`<div class="empty">${icon('file',26)}<strong style="display:block;margin:10px">Aperçu indisponible pour ce format</strong>Tu peux ouvrir ou télécharger le document avec le bouton ci-dessous.</div>`;}else body='<p>Aucun fichier joint à cette synthèse.</p>';modalShell(sm.title,`${esc(sm.subject||'Cours')} · ${esc(sm.chapter||'Sans chapitre associé')}`,`${body}<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px"><button class="btn-secondary" data-action="download-summary" data-id="${sm.id}">${icon('download',15)} Télécharger le fichier</button><button class="btn" data-action="edit-summary" data-id="${sm.id}">${icon('edit',15)} Modifier la synthèse</button></div>`,{wide:true});}
function trigger(action,el){const id=el?.dataset.id;switch(action){case'navigate':page=el.dataset.page;practice=null;selectedDeck=null;render();break;case'new-event':openEventModal(null,agendaDate);break;case'new-event-for-date':openEventModal(null,agendaDate);break;case'edit-event':openEventModal(id);break;case'delete-event':deleteEvent(id);break;case'select-date':agendaDate=el.dataset.date;render();break;case'month-prev':agendaDate=shiftMonth(agendaDate,-1);render();break;case'month-next':agendaDate=shiftMonth(agendaDate,1);render();break;case'today':agendaDate=isoToday();render();break;case'agenda-mode':agendaMode=el.dataset.mode;render();break;case'new-folder':openFolderModal();break;case'open-folder':folderId=id==='root'?null:id;folderSearch='';render();break;case'upload':$('#fileInput')?.click();break;case'download-file':downloadFile(id);break;case'rename-node':renameNode(id);break;case'delete-node':deleteNode(id);break;case'new-summary':openSummaryModal();break;case'edit-summary':openSummaryModal(id);break;case'delete-summary':deleteSummary(id);break;case'view-summary':viewSummary(id);break;case'download-summary':{const sm=state.summaries.find(x=>x.id===id);if(sm?.attachment?.data){downloadBlob(dataUrlToBlob(sm.attachment.data),sm.attachment.name||'synthese');}break;}case'revision-mode':revisionMode=el.dataset.mode;selectedDeck=null;render();break;case'new-deck':openDeckModal();break;case'open-deck':selectedDeck=id;render();break;case'back-decks':selectedDeck=null;render();break;case'new-card':openCardModal(el.dataset.id||selectedDeck);break;case'edit-card':openCardModal(el.dataset.deck,id);break;case'delete-card':deleteCard(el.dataset.deck,id);break;case'deck-menu':{const d=state.decks.find(d=>d.id===id);if(d)openDeckSettings(d);break;}case'practice-deck':startPractice(id);break;case'flip-card':if(practice){practice.revealed=!practice.revealed;render();}break;case'practice-rate':rateCard(el.dataset.known==='1');break;case'stop-practice':practice=null;render();break;case'finish-practice':practice=null;render();break;case'close-modal':closeModal();break;case'set-accent':state.settings.accent=el.dataset.color;saveState();render();break;case'set-appearance':state.settings.appearance=el.dataset.mode;saveState();render();break;case'new-category':openCategoryModal();break;case'edit-category':openCategoryModal(id);break;case'delete-category':deleteCategory(id);break;case'export-data':exportData();break;case'import-data':$('#importInput')?.click();break;case'clear-data':clearData();break;default:break;}}
function shiftMonth(date,n){const d=new Date(date+'T12:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function openDeckSettings(deck){modalShell('Options du paquet',`Gère le nom et le contenu de « ${esc(deck.title)} ».`,`<div class="settings-action" style="padding-top:0" role="button" data-action="edit-deck-title" data-id="${deck.id}">${icon('edit',19)}<span class="sa-text"><strong>Modifier le paquet</strong><small>Changer le nom ou la description.</small></span>${icon('chevron',15)}</div><div class="settings-action" role="button" data-action="add-card-from-menu" data-id="${deck.id}">${icon('plus',19)}<span class="sa-text"><strong>Ajouter une carte</strong><small>Créer une nouvelle question / réponse.</small></span>${icon('chevron',15)}</div><button class="settings-action danger-text" data-action="delete-deck" data-id="${deck.id}">${icon('trash',19)}<span class="sa-text"><strong>Supprimer le paquet</strong><small>Cette action supprimera aussi ses cartes.</small></span>${icon('chevron',15)}</button>`);}
function editDeckTitle(id){const d=state.decks.find(d=>d.id===id);if(!d)return;modalShell('Modifier le paquet','Change le nom ou la description.',`<form data-form="edit-deck"><input type="hidden" name="id" value="${id}"><div class="field"><label>Nom *</label><input name="title" required maxlength="100" value="${esc(d.title)}"></div><div class="field" style="margin-top:12px"><label>Description</label><textarea name="description">${esc(d.description||'')}</textarea></div>${modalActions('Annuler','Enregistrer')}</form>`);}
function clearData(){if(!confirm('Cette action effacera toutes les données de cet espace dans ce navigateur. As-tu exporté une sauvegarde ?'))return;if(!confirm('Dernière confirmation : veux-tu vraiment tout effacer ?'))return;state=freshState();folderId=null;selectedDeck=null;practice=null;fallbackBlobs={};const clearP=dbReady&&db?Promise.all([idbStore('app','readwrite',s=>s.put(state,'state')),idbStore('attachments','readwrite',s=>s.clear())]):Promise.resolve();clearP.then(()=>{saveState();render();toast('Espace réinitialisé.');});}
// Event delegation: controls remain touch-friendly and work in the standalone HTML.
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.classList.contains('calendar-event'))e.stopPropagation();trigger(el.dataset.action,el);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-action]')&&!e.target.matches('button,input,textarea,select')){e.preventDefault();trigger(e.target.dataset.action,e.target);}});
document.addEventListener('submit',async e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const f=form.dataset.form, fd=new FormData(form), v=Object.fromEntries(fd.entries());try{
 if(f==='event'){const existing=state.events.find(x=>x.id===v.id);const item={id:v.id||uid(),title:v.title.trim(),categoryId:v.categoryId||state.categories[0]?.id,date:v.date,time:v.time,location:v.location.trim(),description:v.description.trim(),done:fd.has('done'),createdAt:existing?.createdAt||Date.now(),updatedAt:Date.now()};if(!item.categoryId){toast('Ajoute d’abord un type d’événement dans les réglages.');return;}if(existing)state.events=state.events.map(x=>x.id===item.id?item:x);else state.events.push(item);agendaDate=item.date;page='agenda';closeModal();await saveState();render();toast(existing?'Événement modifié.':'Événement ajouté à l’agenda.');}
 else if(f==='folder'){const name=v.name.trim();if(state.nodes.some(n=>n.type==='folder'&&(n.parentId||'')===(v.parentId||'')&&n.name.toLowerCase()===name.toLowerCase())){toast('Un dossier portant ce nom existe déjà à cet endroit.');return;}const node={id:uid(),name,type:'folder',parentId:v.parentId||null,createdAt:Date.now()};state.nodes.push(node);folderId=node.id;closeModal();await saveState();render();toast('Dossier créé.');}
 else if(f==='summary'){const existing=state.summaries.find(s=>s.id===v.id);const picked=form.querySelector('#sumFile')?.files?.[0];if(!existing&&!picked){toast('Choisis le fichier de ta synthèse.');return;}let attachment=existing?.attachment||null;if(picked){if(picked.size>15*1024*1024){toast('Le fichier dépasse 15 Mo. Choisis un fichier plus léger.');return;}const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=reject;r.readAsDataURL(picked)});attachment={name:picked.name,type:picked.type||'application/octet-stream',data};}const item={id:v.id||uid(),title:v.title.trim(),subject:v.subject.trim(),chapter:(v.chapter||'').trim(),tags:v.tags.trim(),content:(v.content||'').trim(),attachment,updatedAt:Date.now(),createdAt:existing?.createdAt||Date.now()};if(existing)state.summaries=state.summaries.map(s=>s.id===item.id?item:s);else state.summaries.push(item);closeModal();summaryEditingId=null;await saveState();render();toast(existing?'Synthèse mise à jour.':'Synthèse importée.');}
 else if(f==='deck'){const d={id:uid(),title:v.title.trim(),description:v.description.trim(),cards:[],known:0,createdAt:Date.now()};state.decks.push(d);selectedDeck=d.id;revisionMode='flashcards';closeModal();await saveState();render();toast('Paquet créé. Ajoute ta première carte !');}
 else if(f==='card'){const d=state.decks.find(d=>d.id===v.deckId);if(!d)return;const existing=(d.cards||[]).find(c=>c.id===v.id);const c={id:v.id||uid(),front:v.front.trim(),back:v.back.trim(),createdAt:existing?.createdAt||Date.now()};if(existing)d.cards=d.cards.map(x=>x.id===c.id?c:x);else d.cards.push(c);selectedDeck=d.id;closeModal();await saveState();render();toast(existing?'Carte modifiée.':'Carte ajoutée.');}
 else if(f==='category'){const name=v.name.trim();if(state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.id!==v.id)){toast('Ce type existe déjà.');return;}if(v.id){state.categories=state.categories.map(c=>c.id===v.id?{...c,name,color:v.color}:c);}else state.categories.push({id:uid(),name,color:v.color||state.settings.accent});closeModal();await saveState();render();toast('Type d’événement enregistré.');}
 else if(f==='rename-node'){const n=state.nodes.find(n=>n.id===v.id);if(!n)return;const name=v.name.trim();if(n.type==='folder'&&state.nodes.some(x=>x.type==='folder'&&x.id!==n.id&&(x.parentId||'')===(n.parentId||'')&&x.name.toLowerCase()===name.toLowerCase())){toast('Un dossier de ce nom existe déjà.');return;}n.name=name;closeModal();await saveState();render();toast('Nom modifié.');}
 else if(f==='edit-deck'){const d=state.decks.find(d=>d.id===v.id);if(!d)return;d.title=v.title.trim();d.description=v.description.trim();selectedDeck=d.id;closeModal();await saveState();render();toast('Paquet modifié.');}
 }catch(err){console.error(err);toast('Une erreur est survenue. Réessaie.');}});
document.addEventListener('change',async e=>{if(e.target.id==='fileInput'&&e.target.files?.length){await uploadFiles([...e.target.files]);e.target.value='';}if(e.target.id==='importInput'&&e.target.files?.[0]){await importDataFile(e.target.files[0]);e.target.value='';}if(e.target.id==='customAccent'){state.settings.accent=e.target.value;await saveState();render();}if(e.target.id==='fileSearch'){folderSearch=e.target.value;const pos=e.target.selectionStart;render();const input=$('#fileSearch');if(input){input.focus();input.setSelectionRange(pos,pos);}}});
document.addEventListener('input',e=>{if(e.target.id==='fileSearch'){folderSearch=e.target.value;const old=$('.file-grid');if(!old){render();return;}const pos=e.target.selectionStart;render();const input=$('#fileSearch');if(input){input.focus();try{input.setSelectionRange(pos,pos)}catch{}}}});
$('#modalRoot').addEventListener('click',e=>{if(e.target===$('#modalRoot'))closeModal();});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const id=el.dataset.id;switch(el.dataset.action){case'edit-deck-title':closeModal();editDeckTitle(id);break;case'add-card-from-menu':closeModal();openCardModal(id);break;case'delete-deck':{const d=state.decks.find(d=>d.id===id);if(d&&confirm(`Supprimer le paquet « ${d.title} » et ses cartes ?`)){state.decks=state.decks.filter(x=>x.id!==id);selectedDeck=null;closeModal();saveState();render();toast('Paquet supprimé.');}break;}}});
// Make first launch informative, then recover the exact local state on subsequent visits.
loadSaved();
})();
</script>
